<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Option C: explorer, 1600x1000 wireframe</title>
  <desc>Neutral wireframe. KPI chips act as metric switch, group-by switch, one large stacked chart with brush strip and legend toggles, readout line, linked sortable table below, a run list drawer below the table.</desc>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <rect x="0" y="0" width="232" height="1000" fill="#ececec" stroke="#bdbdbd"/>
  <text x="16" y="30" fill="#666">Sidebar (232 px)</text>
  <rect x="12" y="80" width="208" height="30" rx="6" fill="#d8d8d8"/><text x="24" y="100" fill="#444">Usage (current)</text>
  <rect x="232" y="0" width="1368" height="48" fill="#f6f6f6" stroke="#d0d0d0"/>
  <text x="252" y="30" font-size="18" font-weight="600" fill="#333">Usage</text>
  <rect x="1270" y="10" width="140" height="28" rx="6" fill="#fff" stroke="#999"/><text x="1288" y="29" fill="#444">Copy as CSV</text>
  <rect x="1424" y="10" width="150" height="28" rx="6" fill="#fff" stroke="#999"/><text x="1442" y="29" fill="#444">Save CSV...</text>
  <rect x="232" y="48" width="1368" height="52" fill="#fafafa" stroke="#d0d0d0"/>
  <text x="252" y="62" font-size="11" fill="#888">Sticky filter bar + chips, unchanged</text>
  <rect x="252" y="68" width="330" height="26" rx="6" fill="#fff" stroke="#999"/><text x="264" y="86" fill="#444">7d | 30d | This month | Last month | Months</text>
  <rect x="596" y="68" width="150" height="26" rx="6" fill="#fff" stroke="#999"/><text x="608" y="86" fill="#444">Day | Week | Month</text>
  <rect x="760" y="68" width="120" height="26" rx="6" fill="#fff" stroke="#999"/><text x="772" y="86" fill="#444">All projects</text>
  <rect x="890" y="68" width="100" height="26" rx="6" fill="#fff" stroke="#999"/><text x="902" y="86" fill="#444">All kinds</text>
  <rect x="1000" y="68" width="130" height="26" rx="6" fill="#fff" stroke="#999"/><text x="1012" y="86" fill="#444">All connections</text>
  <!-- metric switch tiles -->
  <text x="252" y="120" font-size="11" fill="#888">Metric = the KPI tiles (radio group). Selected tile drives the chart and table.</text>
  <g stroke="#d0d0d0" fill="#fff">
    <rect x="252" y="128" width="300" height="76" fill="#e8e8e8" stroke="#555" stroke-width="2"/>
    <rect x="564" y="128" width="300" height="76"/><rect x="876" y="128" width="300" height="76"/><rect x="1188" y="128" width="392" height="76"/>
  </g>
  <g fill="#333">
    <text x="268" y="150" fill="#555">Estimated cost (selected)</text><text x="268" y="180" font-size="24" font-weight="600">$412.30+</text><text x="268" y="197" font-size="11" fill="#666">up 12% vs previous 30 days</text>
    <text x="580" y="150" fill="#555">Tokens</text><text x="580" y="180" font-size="24" font-weight="600">22.4M</text><text x="580" y="197" font-size="11" fill="#666">up 6%</text>
    <text x="892" y="150" fill="#555">Runs</text><text x="892" y="180" font-size="24" font-weight="600">212</text><text x="892" y="197" font-size="11" fill="#666">down 4%</text>
    <text x="1204" y="150" fill="#555">Quality (cache hit, no result, retries, wall) </text><text x="1204" y="180" font-size="16">64% · 7% · 12 · 38 h</text><text x="1204" y="197" font-size="11" fill="#666">cost per run $1.94, a table column set not a chart metric</text>
  </g>
  <!-- explorer card -->
  <rect x="252" y="216" width="1328" height="424" fill="#fafafa" stroke="#d0d0d0"/>
  <text x="268" y="240" font-size="15" font-weight="600" fill="#333">Explorer: cost by project over time</text>
  <text x="268" y="258" font-size="12" fill="#666">Billing is 61% of this period's estimated cost, peaking on 3 Nov.</text>
  <rect x="860" y="224" width="330" height="26" rx="6" fill="#fff" stroke="#999"/><text x="872" y="242" fill="#444">Group by: Project | Model | Role | Connection</text>
  <rect x="1204" y="224" width="170" height="26" rx="6" fill="#fff" stroke="#999"/><text x="1216" y="242" fill="#444">Compare previous: on</text>
  <rect x="1388" y="224" width="70" height="26" rx="6" fill="#fff" stroke="#999"/><text x="1400" y="242" fill="#444">Bars | Line</text>
  <rect x="1470" y="224" width="96" height="26" rx="6" fill="#fff" stroke="#999"/><text x="1482" y="242" fill="#444">Reset zoom</text>
  <!-- plot -->
  <line x1="310" y1="280" x2="310" y2="500" stroke="#bbb"/><line x1="310" y1="500" x2="1300" y2="500" stroke="#bbb"/>
  <g stroke="#e6e6e6"><line x1="310" y1="330" x2="1300" y2="330"/><line x1="310" y1="385" x2="1300" y2="385"/><line x1="310" y1="440" x2="1300" y2="440"/></g>
  <g fill="#9a9a9a"><rect x="330" y="450" width="18" height="50"/><rect x="370" y="420" width="18" height="80"/><rect x="410" y="430" width="18" height="70"/><rect x="450" y="390" width="18" height="110"/><rect x="490" y="400" width="18" height="100"/><rect x="530" y="360" width="18" height="140"/><rect x="570" y="380" width="18" height="120"/><rect x="610" y="410" width="18" height="90"/><rect x="650" y="340" width="18" height="160"/><rect x="690" y="350" width="18" height="150"/><rect x="730" y="300" width="18" height="200"/><rect x="770" y="330" width="18" height="170"/><rect x="810" y="380" width="18" height="120"/><rect x="850" y="430" width="18" height="70"/><rect x="890" y="390" width="18" height="110"/><rect x="930" y="350" width="18" height="150"/><rect x="970" y="320" width="18" height="180"/><rect x="1010" y="370" width="18" height="130"/><rect x="1050" y="410" width="18" height="90"/><rect x="1090" y="390" width="18" height="110"/></g>
  <g fill="#c8c8c8"><rect x="330" y="470" width="18" height="30"/><rect x="650" y="400" width="18" height="100"/><rect x="730" y="360" width="18" height="140"/><rect x="970" y="380" width="18" height="120"/></g>
  <polyline points="339,470 379,455 419,462 459,430 499,440 539,420 579,425 619,450 659,400 699,410 739,380 779,400 819,430 859,460 899,430 939,410 979,380 1019,420 1059,450 1099,430" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3"/>
  <rect x="730" y="300" width="18" height="200" fill="none" stroke="#222" stroke-width="2"/>
  <rect x="716" y="272" width="170" height="40" fill="#fff" stroke="#999"/><text x="724" y="288" font-size="11" fill="#444">Tue 3 Nov  $9.80, 14 runs</text><text x="724" y="303" font-size="11" fill="#777">previous: $7.20  (+36%)</text>
  <text x="1306" y="304" font-size="10" fill="#888">Tooltip box mirrors the fixed readout line; both exist</text>
  <!-- legend -->
  <g font-size="12" fill="#333">
    <text x="1318" y="284" font-weight="600">Legend (toggle)</text>
    <rect x="1318" y="296" width="12" height="12" fill="#9a9a9a"/><text x="1338" y="307">Billing  $252.10</text>
    <rect x="1318" y="320" width="12" height="12" fill="#b4b4b4"/><text x="1338" y="331">Docs  $98.40</text>
    <rect x="1318" y="344" width="12" height="12" fill="#c8c8c8"/><text x="1338" y="355">Chat  $31.00</text>
    <rect x="1318" y="368" width="12" height="12" fill="#dcdcdc"/><text x="1338" y="379">Website  $18.20</text>
    <rect x="1318" y="392" width="12" height="12" fill="none" stroke="#999" stroke-dasharray="3 2"/><text x="1338" y="403">Skill asst.  unknown</text>
    <text x="1318" y="430" font-size="11" fill="#777">click = hide/show series;</text><text x="1318" y="445" font-size="11" fill="#777">alt-click = isolate</text>
  </g>
  <!-- brush -->
  <rect x="310" y="520" width="990" height="44" fill="#f1f1f1" stroke="#ccc"/>
  <polyline points="310,556 420,548 540,540 660,530 780,536 900,544 1020,534 1140,546 1300,550" fill="none" stroke="#999"/>
  <rect x="640" y="520" width="330" height="44" fill="#bdbdbd" fill-opacity="0.35" stroke="#555"/><rect x="636" y="526" width="8" height="32" fill="#777"/><rect x="966" y="526" width="8" height="32" fill="#777"/>
  <text x="310" y="582" font-size="11" fill="#888">Brush strip = whole period. Drag a range or Shift+arrows on its handles to set a custom sub-range (becomes a "Range:" chip).</text>
  <text x="268" y="610" font-size="12" fill="#444">Readout (fixed line): 3 Nov  $9.80 across 14 runs. Billing $6.10, Docs $3.70.  Keyboard: arrows = bucket, Up/Down = series, Enter = narrow, Esc = clear.</text>
  <text x="268" y="628" font-size="11" fill="#888">Zoom animates only the axis swap (150 ms) and never under reduced motion.</text>
  <!-- linked table -->
  <rect x="252" y="652" width="1328" height="330" fill="#fff" stroke="#d0d0d0"/>
  <text x="268" y="676" font-size="15" font-weight="600" fill="#333">Linked table: by project (same group, same metric, same range)</text>
  <text x="1170" y="676" fill="#444">Columns ▾   Sort: cost</text>
  <g fill="#555" font-size="12"><text x="290" y="706">Project ^</text><text x="520" y="706">Cost</text><text x="640" y="706">Share</text><text x="740" y="706">Runs</text><text x="830" y="706">Tokens</text><text x="940" y="706">Per run</text><text x="1050" y="706">Cache hit</text><text x="1170" y="706">vs previous</text><text x="1300" y="706">Trend (spark)</text></g>
  <line x1="268" y1="714" x2="1564" y2="714" stroke="#ddd"/>
  <rect x="268" y="722" width="1296" height="28" fill="#e8e8e8"/>
  <g fill="#555" font-size="12"><rect x="272" y="730" width="10" height="10" fill="#9a9a9a"/><text x="290" y="741">Billing  (row hover/focus highlights its series)</text><text x="520" y="741">$252.10</text><text x="640" y="741">61%</text><text x="740" y="741">82</text><text x="830" y="741">9.1M</text><text x="940" y="741">$3.07</text><text x="1050" y="741">71%</text><text x="1170" y="741">up 9%</text>
  <rect x="272" y="764" width="10" height="10" fill="#b4b4b4"/><text x="290" y="774">Docs</text><text x="520" y="774">$98.40</text><text x="640" y="774">24%</text><text x="740" y="774">51</text><text x="830" y="774">3.8M</text><text x="940" y="774">$1.93</text><text x="1050" y="774">58%</text><text x="1170" y="774">down 4%</text>
  <rect x="272" y="790" width="10" height="10" fill="#c8c8c8"/><text x="290" y="800">Chat</text><text x="520" y="800">$31.00</text><text x="640" y="800">8%</text><text x="740" y="800">40</text><text x="830" y="800">1.2M</text><text x="940" y="800">$0.78</text><text x="1050" y="800">64%</text><text x="1170" y="800">up 22%</text></g>
  <g fill="none" stroke="#999"><polyline points="1300,738 1330,732 1360,736 1390,728"/><polyline points="1300,772 1330,770 1360,776 1390,772"/><polyline points="1300,798 1330,792 1360,796 1390,790"/></g>
  <text x="268" y="840" font-size="12" fill="#444">Row Enter = narrow to project (chip). Row "..." menu = Open project, Open History.</text>
  <text x="268" y="866" font-size="12" fill="#444">Runs drawer (collapsed): "Runs in this selection, 82" opens the existing AllRuns list; "Runs worth a look" and Efficiency live in a secondary "Insights" band under the table.</text>
  <text x="268" y="900" font-size="11" fill="#888">Insights band (second fold): efficiency instruments, staffing, runs worth a look, unchanged components in a 2-column grid.</text>
  <text x="252" y="996" font-size="11" fill="#888">Cutline: chart + table header fit at 1600x1000 without scroll; at 1024x640 the chart is 220 px high and the table scrolls.</text>
</svg>
