# Checks every push to main or dev (docs-only pushes, docs/** and Markdown, are skipped) and every pull request into
# main or dev (always runs). Free: no smoke scripts and no token-spending e2e (setup, history and worktree need the
# user's consent and never run here).
name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The maintenance e2e shells out to git a lot.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    env:
      # Fresh runners have no git identity; the e2e fixtures and OrgAI's merge commits need one.
      GIT_AUTHOR_NAME: OrgAI CI
      GIT_AUTHOR_EMAIL: ci@orgai.local
      GIT_COMMITTER_NAME: OrgAI CI
      GIT_COMMITTER_EMAIL: ci@orgai.local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: e2e (free)
        run: npm run e2e:free
        env:
          # The e2e scripts ignore this and give each script its own temp data dir (E2E_DATA_DIR overrides); this only keeps
          # any stray launch off the runner's profile.
          # (The runner context is only available at step level.)
          ORGAI_DATA_DIR: ${{ runner.temp }}/orgai-data
          # macOS only: the runner's work area is 1024x684, which clamps the 1600x1000 / 2400x1000 e2e windows.
          ORGAI_WINDOW_LARGER_THAN_SCREEN: ${{ runner.os == 'macOS' && '1' || '' }}
      - name: Upload e2e screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots-${{ runner.os }}
          path: e2e/shots/**
          if-no-files-found: ignore
          retention-days: 7

  pack:
    name: pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    env:
      # Unsigned: never look for a signing identity on the runner.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unpacked app only, no installers: catches electron-builder config and asarUnpack breakage.
      # (`npm run pack`, not `npm pack`, which is npm's own tarball command.)
      - run: npm run pack
      # The packaged orgai command (cli-spec 7): --version, doctor, and a mock exec (ORGAI_MOCK=1, no tokens) in-process
      # and through the spawned background app, on a temp data folder. UNVERIFIED until CI runs it: the Windows
      # launcher (cmd.exe running orgai.cmd) and the default-host step (the packaged app spawned with --headless-host).
      # continue-on-error until it has passed once on both windows-latest and macos-15 (review H4): it has never run in
      # CI, its Windows path has never run anywhere, and a first-run failure should not hide the rest of the pack job's
      # result. A failure still shows on the step (and in the job's annotations). Drop this line once both legs are green.
      - name: pack:verify
        run: npm run pack:verify
        continue-on-error: true
