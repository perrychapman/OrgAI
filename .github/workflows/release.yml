# Builds the installers and drafts a GitHub release. Releases are cut from main only.
# - Flow: work lands on dev. Bump package.json's version on dev, merge dev -> main by PR, then tag the main commit
#   `v<version>` (must equal package.json's version) and push the tag. That builds all three and drafts the release;
#   publish the draft by hand.
# - The meta job refuses a tag, or a dispatch with dry_run off, whose commit is not reachable from origin/main.
# - Or run it by hand (workflow_dispatch). dry_run (the default) only builds and uploads workflow artifacts; a dry run
#   of a ref that is not on main is allowed (build only) and prints a notice.
# Nothing is uploaded by electron-builder itself (`--publish never`); the publish job creates the draft release.
# Mac builds are unsigned unless the CSC_LINK secret is set; notarization runs only when the APPLE_* secrets are set.
# The orgai npm package (Wave 7, docs/design/cli-standalone.md 3.4): npm-package builds the tarball once from the
# CLI bundle of this commit, verify-npm installs that exact tarball on three OSes and two Node versions, and
# publish-npm publishes it (sha256 compared, --provenance, `next` for prerelease versions) only under the same guard as
# the desktop release and only after a reviewer approves the `npm-publish` environment. Never a rebuild.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release (e.g. v0.1.0). Empty builds the selected branch.
        required: false
        default: ''
      dry_run:
        description: Build only; do not create a release.
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # OWNER DECISION (2026-11-06), to revisit: the published package ships WITHOUT npm-shrinkwrap.json ('none': direct
  # dependencies pinned to exact versions, the tree below them resolved by npm at install). A honoured shrinkwrap made
  # npm 11.12.1 install every platform's Claude runtime (eight optional packages, about 2 GB per install; WP-A found it
  # and verify-npm step 1 fails with it), where 'none' installs about 300 MB. The 'full' path stays available behind
  # this one setting (build-npm-package.mjs --shrinkwrap) for when npm or the SDK's optional packages make a
  # shrinkwrap affordable. ci.yml uses 'none' too and still dry-runs the full derivation on every PR.
  NPM_SHRINKWRAP: none

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      # Full history plus origin/main and the tags, for the reachability check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = "push" ]; then
            tag="$REF_NAME"; ref="$REF"; publish=true
          else
            tag="$INPUT_TAG"; ref="${INPUT_TAG:-$REF}"
            if [ "$DRY_RUN" = "true" ]; then publish=false; else publish=true; fi
            if [ "$publish" = "true" ] && [ -z "$tag" ]; then
              echo "::error::A non-dry-run release needs a tag."; exit 1
            fi
          fi
          # Releases are cut from main only. A branch ref is checked through its remote-tracking ref.
          check="$ref"
          case "$check" in refs/heads/*) check="refs/remotes/origin/${check#refs/heads/}" ;; esac
          if ! commit="$(git rev-parse --verify --quiet "$check^{commit}")"; then
            echo "::error::Cannot resolve $ref to a commit."; exit 1
          fi
          if git merge-base --is-ancestor "$commit" origin/main; then
            echo "$ref ($commit) is reachable from origin/main."
          elif [ "$publish" = "true" ]; then
            echo "::error::$ref ($commit) is not reachable from origin/main. Releases are cut from main only: merge dev into main by PR, then tag the main commit."
            exit 1
          else
            echo "::notice::$ref ($commit) is not on main. Dry run: build only, nothing is published."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag ref=$ref sha=$commit publish=$publish"

  build:
    name: ${{ matrix.name }}
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # nsis + portable (targets come from electron-builder.yml).
          - name: windows
            os: windows-latest
            args: --win
            arch: x64
          # Each mac arch on its native runner so `npm ci` installs the matching
          # @anthropic-ai/claude-agent-sdk-darwin-<arch> and @openai/codex-darwin-<arch> optional deps.
          - name: mac-arm64
            os: macos-15
            args: --mac --arm64
            arch: arm64
          - name: mac-x64
            os: macos-15-intel
            args: --mac --x64
            arch: x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check runner arch
        shell: bash
        run: |
          actual="$(node -p process.arch)"
          if [ "$actual" != "${{ matrix.arch }}" ]; then
            echo "::error::Runner ${{ matrix.os }} is $actual, expected ${{ matrix.arch }}."; exit 1
          fi
      - name: Check tag matches package.json
        if: needs.meta.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: node scripts/ci-check-version.mjs "$TAG"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package
        # Windows keeps signAndEditExecutable: true (icon and version info stamped into OrgAI.exe); the runner is an
        # administrator, so winCodeSign's symlinks extract. If this step fails extracting winCodeSign, append
        # `-c.win.signAndEditExecutable=false` to the windows args above (OrgAI.exe then keeps Electron's icon).
        # Signing secrets reach the mac legs only (a mac .p12 in CSC_LINK must not be tried on Windows), and only
        # when set: electron-builder reads an empty CSC_LINK as a certificate path and fails with "<repo> not a file",
        # so absent secrets are left unset and the build is unsigned (CSC_IDENTITY_AUTO_DISCOVERY=false).
        shell: bash
        env:
          SECRET_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$SECRET_CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true CSC_LINK="$SECRET_CSC_LINK" CSC_KEY_PASSWORD="$SECRET_CSC_KEY_PASSWORD"
            if [ -n "$SECRET_APPLE_ID" ]; then
              export APPLE_ID="$SECRET_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$SECRET_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
            fi
          fi
          npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: orgai-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  # The npm tarball, built once from this commit's CLI bundle (the same vite.cli.config.ts the app's build uses).
  npm-package:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      file: ${{ steps.pack.outputs.file }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches package.json
        if: needs.meta.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: node scripts/ci-check-version.mjs "$TAG"
      - run: npm ci
      - run: npx vite build -c vite.cli.config.ts
      - id: pack
        shell: bash
        run: |
          args=()
          if [ "$NPM_SHRINKWRAP" = "full" ]; then args=(--shrinkwrap); fi
          node scripts/build-npm-package.mjs "${args[@]}"
          file="$(cd release/npm && ls *.tgz)"
          sum="$(sha256sum "release/npm/$file" | cut -d' ' -f1)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "$file sha256 $sum"
      - uses: actions/upload-artifact@v4
        with:
          name: orgai-npm
          path: |
            release/npm/*.tgz
            release/npm/*.tgz.sha256
          if-no-files-found: error
          retention-days: 14

  # cli-standalone.md 3.4 steps 1-7 on the exact tarball: Node at the engines floor of the 22 line and current 24.
  verify-npm:
    name: verify-npm (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: [meta, npm-package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
        # 22.19.0 = scripts/lib/npmPackage.mjs NODE_FLOOR_22 (engines.node), pinned exactly.
        node: ['22.19.0', '24']
    env:
      GIT_AUTHOR_NAME: OrgAI CI
      GIT_AUTHOR_EMAIL: ci@orgai.local
      GIT_COMMITTER_NAME: OrgAI CI
      GIT_COMMITTER_EMAIL: ci@orgai.local
    steps:
      # Only the scripts are needed (they import nothing from node_modules); no npm ci.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: orgai-npm
          path: npm-artifact
      - name: Compare the tarball's sha256
        shell: bash
        env:
          FILE: ${{ needs.npm-package.outputs.file }}
          WANT: ${{ needs.npm-package.outputs.sha256 }}
        run: |
          got="$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'))" "npm-artifact/$FILE")"
          if [ "$got" != "$WANT" ]; then echo "::error::$FILE sha256 $got, expected $WANT"; exit 1; fi
      # Step 7 (Codex, bring-your-own): the pinned version from package.json, installed apart from the tarball.
      - name: Install Codex for step 7
        shell: bash
        run: |
          v="$(node -p "require('./package.json').dependencies['@openai/codex']")"
          npm install --global --prefix "$RUNNER_TEMP/codex" "@openai/codex@$v"
          if [ "$RUNNER_OS" = "Windows" ]; then echo "$RUNNER_TEMP/codex" >> "$GITHUB_PATH"; else echo "$RUNNER_TEMP/codex/bin" >> "$GITHUB_PATH"; fi
      - name: verify-npm
        shell: bash
        env:
          FILE: ${{ needs.npm-package.outputs.file }}
        run: node scripts/verify-npm.mjs --tarball "npm-artifact/$FILE"

  # Publishes the verified tarball. The `npm-publish` environment must require a reviewer (repository settings:
  # npm is not reversible after 72 hours; D2). Trusted publishing (OIDC, id-token) with provenance; npm must be 11.5.1+.
  # D2 fallback: npm configures a trusted publisher only on a package that already exists, so the first version (and
  # any release before trusted publishing is set up) needs a granular automation token in the `npm-publish`
  # environment's NPM_TOKEN secret. With the secret set it is used; without it the job relies on OIDC alone.
  # Setup guard (review round 2): GitHub creates a missing `npm-publish` environment on first use with NO protection
  # rules, which would publish without a reviewer. So the job refuses unless the environment variable
  # NPM_PUBLISH_ENABLED is 'true'. Set it ONLY as a variable of the `npm-publish` environment, after adding its
  # required reviewers (Settings > Environments > npm-publish: Required reviewers, Deployment branches and tags: allow the tag pattern `v*` (this job runs on a tag ref, which a branch-only rule refuses; the meta job already requires the commit to be on main), then
  # Environment variables: NPM_PUBLISH_ENABLED = true); never as a repository or organisation variable, which every
  # job sees. A refused run publishes nothing and can be re-run once the environment is set up.
  # The vars context merges environment, repository and organisation variables, so a repository-level
  # NPM_PUBLISH_ENABLED would satisfy that check alone. A second step therefore asks the API for the environment and
  # refuses unless it has a required_reviewers rule with at least one reviewer (fails closed on any API error).
  publish-npm:
    needs: [meta, build, npm-package, verify-npm]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Require reviewers on the npm-publish environment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          fail() {
            echo "::error::Not publishing: $1 Open Settings > Environments > npm-publish, add at least one required reviewer, then re-run this job."
            exit 1
          }
          if ! body="$(gh api "repos/$REPO/environments/npm-publish")"; then
            fail "could not read the npm-publish environment through the GitHub API."
          fi
          n="$(printf '%s' "$body" | jq '[.protection_rules[]? | select(.type == "required_reviewers") | (.reviewers // [])[]] | length')" || fail "the API answer for npm-publish could not be read."
          case "$n" in ''|*[!0-9]*) fail "the API answer for npm-publish could not be read." ;; esac
          if [ "$n" -lt 1 ]; then
            fail "the npm-publish environment has no required reviewers."
          fi
          echo "npm-publish has $n required reviewer(s)."
      - name: Require a configured npm-publish environment
        shell: bash
        env:
          ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "::error::Not publishing: the npm-publish environment is not set up. Add required reviewers to it, then set its environment variable NPM_PUBLISH_ENABLED=true (never at repository level), and re-run this job."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm install --global npm@11.21.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: orgai-npm
          path: npm-artifact
      - name: Publish the verified tarball
        shell: bash
        env:
          FILE: ${{ needs.npm-package.outputs.file }}
          WANT: ${{ needs.npm-package.outputs.sha256 }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          got="$(sha256sum "npm-artifact/$FILE" | cut -d' ' -f1)"
          if [ "$got" != "$WANT" ]; then echo "::error::$FILE sha256 $got, expected $WANT"; exit 1; fi
          version="$(tar -xOzf "npm-artifact/$FILE" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          if [ -n "$NPM_TOKEN" ]; then
            # The token stays in the environment: the npmrc names the variable, npm expands it (never echoed).
            npmrc="$RUNNER_TEMP/npmrc-publish"
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$npmrc"
            export NPM_CONFIG_USERCONFIG="$npmrc"
            echo "Credentials: the NPM_TOKEN automation token (D2 fallback)"
          else
            echo "Credentials: trusted publishing (OIDC). A first publish of a new package needs NPM_TOKEN instead."
          fi
          echo "Publishing $FILE ($version) with --tag $tag"
          npm publish "npm-artifact/$FILE" --provenance --access public --tag "$tag"

  publish:
    needs: [meta, build]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # One folder per leg (no merge-multiple): both mac legs may write a latest-mac.yml.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: orgai-*
      - run: ls -R dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          # latest*.yml is left out: auto-update is not wired, and the two mac legs' copies would collide.
          files: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.blockmap
