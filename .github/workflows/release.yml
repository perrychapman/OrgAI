# Builds the installers and drafts a GitHub release. Releases are cut from main only.
# - Flow: work lands on dev. Bump package.json's version on dev, merge dev -> main by PR, then tag the main commit
#   `v<version>` (must equal package.json's version) and push the tag. That builds all three and drafts the release;
#   publish the draft by hand.
# - The meta job refuses a tag, or a dispatch with dry_run off, whose commit is not reachable from origin/main.
# - Or run it by hand (workflow_dispatch). dry_run (the default) only builds and uploads workflow artifacts; a dry run
#   of a ref that is not on main is allowed (build only) and prints a notice.
# Nothing is uploaded by electron-builder itself (`--publish never`); the publish job creates the draft release.
# Dry runs are deliberately unsigned. Publishable runs fail unless Windows and macOS signing credentials are present,
# and their artifacts pass platform signature/notarization verification before upload.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release (e.g. v0.1.0). Empty builds the selected branch.
        required: false
        default: ''
      dry_run:
        description: Build only; do not create a release.
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.meta.outputs.commit }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      # Full history plus origin/main and the tags, for the reachability check.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: meta
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = "push" ]; then
            tag="$REF_NAME"; ref="$REF"; publish=true
          else
            tag="$INPUT_TAG"; ref="${INPUT_TAG:-$REF}"
            if [ "$DRY_RUN" = "true" ]; then publish=false; else publish=true; fi
            if [ "$publish" = "true" ] && [ -z "$tag" ]; then
              echo "::error::A non-dry-run release needs a tag."; exit 1
            fi
          fi
          # Releases are cut from main only. A branch ref is checked through its remote-tracking ref.
          check="$ref"
          case "$check" in refs/heads/*) check="refs/remotes/origin/${check#refs/heads/}" ;; esac
          if ! commit="$(git rev-parse --verify --quiet "$check^{commit}")"; then
            echo "::error::Cannot resolve $ref to a commit."; exit 1
          fi
          if git merge-base --is-ancestor "$commit" origin/main; then
            echo "$ref ($commit) is reachable from origin/main."
          elif [ "$publish" = "true" ]; then
            echo "::error::$ref ($commit) is not reachable from origin/main. Releases are cut from main only: merge dev into main by PR, then tag the main commit."
            exit 1
          else
            echo "::notice::$ref ($commit) is not on main. Dry run: build only, nothing is published."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag commit=$commit publish=$publish"

  build:
    name: ${{ matrix.name }}
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # nsis + portable (targets come from electron-builder.yml).
          - name: windows
            os: windows-latest
            args: --win
            arch: x64
          # Each mac arch on its native runner so `npm ci` installs the matching
          # @anthropic-ai/claude-agent-sdk-darwin-<arch> and @openai/codex-darwin-<arch> optional deps.
          - name: mac-arm64
            os: macos-14
            args: --mac --arm64
            arch: arm64
          - name: mac-x64
            os: macos-15-intel
            args: --mac --x64
            arch: x64
    steps:
      # Checkout the exact object that passed the main-reachability check. Never resolve the mutable tag/ref again.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.meta.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Check runner arch
        shell: bash
        run: |
          actual="$(node -p process.arch)"
          if [ "$actual" != "${{ matrix.arch }}" ]; then
            echo "::error::Runner ${{ matrix.os }} is $actual, expected ${{ matrix.arch }}."; exit 1
          fi
      - name: Check tag matches package.json
        if: needs.meta.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: node scripts/ci-check-version.mjs "$TAG"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Require Windows signing credentials
        if: needs.meta.outputs.publish == 'true' && runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          [ -n "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ] || {
            echo "::error::Publishable Windows builds require WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD."; exit 1;
          }
      - name: Require macOS signing and notarization credentials
        if: needs.meta.outputs.publish == 'true' && runner.os == 'macOS'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$MAC_CSC_LINK" ] && [ -n "$MAC_CSC_KEY_PASSWORD" ] && [ -n "$APPLE_ID" ] && \
            [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ] || {
            echo "::error::Publishable macOS builds require signing and notarization credentials."; exit 1;
          }
      - name: Package
        # Windows keeps signAndEditExecutable: true (icon and version info stamped into OrgAI.exe); the runner is an
        # administrator, so winCodeSign's symlinks extract. If this step fails extracting winCodeSign, append
        # `-c.win.signAndEditExecutable=false` to the windows args above (OrgAI.exe then keeps Electron's icon).
        # Signing secrets reach the mac legs only (a mac .p12 in CSC_LINK must not be tried on Windows), and only
        # when set: electron-builder reads an empty CSC_LINK as a certificate path and fails with "<repo> not a file",
        # so absent secrets are left unset and the build is unsigned (CSC_IDENTITY_AUTO_DISCOVERY=false).
        shell: bash
        env:
          PUBLISH: ${{ needs.meta.outputs.publish }}
          SECRET_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          SECRET_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          SECRET_MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
          SECRET_MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          if [ "$PUBLISH" = "true" ] && [ "$RUNNER_OS" = "Windows" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true CSC_LINK="$SECRET_WIN_CSC_LINK" CSC_KEY_PASSWORD="$SECRET_WIN_CSC_KEY_PASSWORD"
          elif [ "$PUBLISH" = "true" ] && [ "$RUNNER_OS" = "macOS" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true CSC_LINK="$SECRET_MAC_CSC_LINK" CSC_KEY_PASSWORD="$SECRET_MAC_CSC_KEY_PASSWORD"
            export APPLE_ID="$SECRET_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$SECRET_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$SECRET_APPLE_TEAM_ID"
          fi
          npx electron-builder ${{ matrix.args }} --publish never
      - name: Verify Windows signatures
        if: needs.meta.outputs.publish == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem release -Filter *.exe
          if (-not $artifacts) { throw 'No Windows executables were produced.' }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature $artifact.FullName
            if ($signature.Status -ne 'Valid') { throw "$($artifact.Name) signature is $($signature.Status)." }
          }
      - name: Verify macOS signatures and notarization
        if: needs.meta.outputs.publish == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          app_path="$(find release -type d -name 'OrgAI.app' -print -quit)"
          [ -n "$app_path" ] || { echo "::error::No packaged OrgAI.app was produced."; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          dmg_path="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          [ -n "$dmg_path" ] || { echo "::error::No DMG was produced."; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orgai-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [meta, build]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.meta.outputs.commit }}
          fetch-depth: 0
      # One folder per leg (no merge-multiple): both mac legs may write a latest-mac.yml.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: orgai-*
      - run: ls -R dist
      - name: Verify release tag still names the reviewed commit
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.meta.outputs.commit }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          actual="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          [ "$actual" = "$EXPECTED_COMMIT" ] || {
            echo "::error::Release tag moved after validation; expected $EXPECTED_COMMIT, got $actual."; exit 1;
          }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          # latest*.yml is left out: auto-update is not wired, and the two mac legs' copies would collide.
          files: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.blockmap
